[project]
name = "router-rebooter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "selenium==4.41.0",
    "webdriver-manager==4.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-mock==3.15.1",
    "python-dotenv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
